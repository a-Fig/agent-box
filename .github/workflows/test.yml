# Every pull request and every push to main runs the checks each change must pass, so
# verification doesn't wait on the laptop, which can run only one Go test at a time and never -race.
# Linux runs the race detector; Windows runs the tests natively, builds the tray, parses the
# provisioning PowerShell.
name: test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run in progress.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-site:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test site/test/files.test.mjs
      - run: node --test controller/test/*.test.mjs

  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l cmd internal)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
      - run: go vet ./...
      - run: GOOS=windows go vet ./...
      # box app's window builds on Linux only with -tags desktop, and macOS gets the no-window build.
      - run: go vet -tags desktop ./...
      - run: GOOS=darwin go vet ./...
      - run: go test -race -count=1 ./...
      - name: provisioning scripts
        run: |
          for f in provision/setup-host.sh provision/install-boxd.sh provision/update-boxd.sh provision/deploy-boxd.sh provision/package-boxd-install.sh provision/reaper.sh; do
            bash -n "$f"
            shellcheck -S warning "$f"
          done
          python3 - <<'PY'
          import glob, subprocess, tempfile, yaml
          for f in sorted(glob.glob('provision/*.yaml')):
              doc = yaml.safe_load(open(f))
              if not isinstance(doc, dict):
                  continue
              ud_raw = (doc.get('config') or {}).get('cloud-init.user-data')
              if not ud_raw:
                  continue
              ud = yaml.safe_load(ud_raw)
              for wf in ud.get('write_files', []):
                  p, c = wf['path'], wf['content']
                  if not (p.endswith('.sh') or c.startswith('#!/bin/bash')):
                      continue
                  shell = 'bash' if c.startswith('#!/bin/bash') else 'sh'
                  with tempfile.NamedTemporaryFile('w', suffix='.sh') as tf:
                      tf.write(c)
                      tf.flush()
                      subprocess.run([shell, '-n', tf.name], check=True)
                      subprocess.run(['shellcheck', '-S', 'warning', '-s', shell, tf.name], check=True)
          dp = yaml.safe_load(open('provision/default-profile.yaml'))
          assert not (dp.get('config') or {}).get('cloud-init.user-data'), 'default-profile.yaml must not run cloud-init on every box launch (#194)'
          ab = yaml.safe_load(open('provision/agent-base.yaml'))
          assert (ab.get('config') or {}).get('cloud-init.user-data'), 'agent-base.yaml must carry the image build cloud-init (#194)'
          PY
      - name: modal runner
        run: |
          python3 -m py_compile provision/modal/*.py && python3 -m unittest discover -s provision/modal -p 'test_*.py'
          sh -n provision/modal/smoke.sh

  # gofmt runs on Linux only: a Windows checkout of LF files can confuse it.
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -count=1 ./...
      - run: go build -ldflags -H=windowsgui -o boxtray.exe ./cmd/boxtray
      - name: parse PowerShell
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem provision/*.ps1) {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errs) | Out-Null
            foreach ($e in $errs) { Write-Host "$($f.Name): $($e.Message)"; $bad++ }
          }
          if ($bad) { exit 1 }
      - name: .wslconfig merge (Windows PowerShell 5.1, as on the PC)
        shell: powershell
        run: ./provision/test-wslconfig.ps1
