<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Inter, system-ui, sans-serif">
  <defs>
    <radialGradient id="glow" cx="50%" cy="26%" r="55%">
      <stop offset="0%" stop-color="#FDEE8C" stop-opacity="0.55"/>
      <stop offset="42%" stop-color="#4f82ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#225BFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#FFFBEA" opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#225BFF"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- cube mark -->
  <g transform="translate(92 92)">
    <rect width="72" height="72" rx="16" fill="#1a49d6"/>
    <g transform="translate(36 36) scale(2.25)" fill="none" stroke="#FFFBEA" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round">
      <path d="M0 -9.8 9.3 -5.2 0 -0.6 -9.3 -5.2Z"/><path d="M-9.3 -5.2V5.4L0 10V-0.6"/><path d="M9.3 -5.2V5.4L0 10"/>
    </g>
  </g>
  <text x="180" y="138" font-size="40" font-weight="800" fill="#FFFBEA" letter-spacing="-1.5">agent-box</text>

  <text x="92" y="330" font-size="76" font-weight="800" fill="#FFFBEA" letter-spacing="-3">Spare compute for your agents,</text>
  <text x="92" y="420" font-size="76" font-weight="800" fill="#FDEE8C" letter-spacing="-3">from a gaming PC.</text>

  <text x="92" y="492" font-size="27" fill="#dfe6ff">Disposable Linux boxes for coding agents. You choose the power. Games always win.</text>

  <text x="92" y="566" font-size="21" fill="#c7d3ff" font-family="ui-monospace, Menlo, monospace">$ box run --new -- go test -race ./...</text>
</svg>
