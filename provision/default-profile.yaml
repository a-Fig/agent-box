# `default` profile of the `agents` project (features.profiles=true, so the project has its own).
# Applied by setup-host.sh with
#   incus profile edit default --project agents < default-profile.yaml
#
# Its limits are the medium size, for boxes launched without `box`. `box` launches every box with
# its size (internal/mode/size.go): user.box.size, limits.memory and a root disk size on the
# instance, which override the values here. The tray sets each box's limits.cpu from its size and
# the mode on every tick. limits.cpu / limits.memory MUST be set per box: the project caps count them.
# The `cache` volume is created by setup-host.sh (project-scoped, shared by all boxes, 30GiB).
# Boxes are deleted by the tray's reaper after user.expires; only /cache outlives a box, and it
# may be wiped at any time.
#
# One-time toolchain installs and profile.d files live in `agent-base.yaml` and run only during
# `setup-host.sh --build-base` (or `--rebuild-base`), so boxes launched from `agent-base` pay no
# cloud-init or package-install cost on first boot (#194).
config:
  limits.cpu: "2"
  limits.memory: 4GiB
  security.nesting: "true"

description: agent-box default profile for the `agents` project
devices:
  root:
    type: disk
    path: /
    pool: default
    size: 30GiB  # medium root disk; `box` sets each box's own size at launch (see docs/DESIGN.md)
  eth0:
    type: nic
    name: eth0
    network: incusbr0
  cache:
    type: disk
    pool: default
    source: cache
    path: /cache  # the volume is project-scoped, so this resolves to agents' `cache` volume
